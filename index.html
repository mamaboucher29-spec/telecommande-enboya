
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d13">
<title>ENBOYA - Télécommande</title>

<style>
:root {
  --bg: #080d13;
  --blue: #19a7ff;
  --green: #35e69a;
  --text: #eaf3fc;
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #142536, #080d13 75%);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  font: inherit;
  touch-action: none;
}

/* BARRE DU HAUT */

header {
  height: 58px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #25394b;
  background: rgba(8,13,19,.85);
  position: relative;
  z-index: 2;
}

.brand {
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 4px;
}

.brand span {
  color: var(--blue);
}

.connection {
  display: flex;
  align-items: center;
  gap: 10px;
}

#status {
  font-size: 12px;
  color: #ffbd55;
}

#connect {
  background: #152c40;
  border: 1px solid var(--blue);
  color: white;
  padding: 9px 14px;
  border-radius: 8px;
  font-weight: bold;
}

/* DISPOSITION */

main {
  height: calc(100vh - 58px);
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 3vw, 42px);
  padding: 15px;
}

.control-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
}

.left-controls {
  flex-direction: row;
}

.right-controls {
  flex-direction: column;
}

.direction {
  width: clamp(65px, 10vw, 105px);
  height: clamp(65px, 10vw, 105px);
  border-radius: 19px;
  border: 1px solid #31516a;
  background: linear-gradient(145deg, #1b3449, #101d2a);
  color: white;
  font-size: clamp(27px, 5vw, 42px);
  font-weight: bold;
  box-shadow: 0 7px 0 #071019, 0 10px 20px #0008;
  cursor: pointer;
  transition: transform .08s, background .08s;
}

.direction.active {
  transform: translateY(5px);
  background: linear-gradient(145deg, #087ec4, #07517f);
  box-shadow: 0 2px 0 #071019, 0 4px 12px #0008;
}

/* CAMERA */

.camera-panel {
  flex: 1;
  max-width: 650px;
  min-width: 120px;
  background: #05090e;
  border: 1px solid #29445a;
  border-radius: 14px;
  padding: 7px;
  box-shadow: 0 10px 35px #0008;
  overflow: hidden;
}

#camera {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background: #030609;
  border-radius: 8px;
}

.camera-label {
  text-align: center;
  color: #7893aa;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 7px 0 2px;
}

/* INTRODUCTION */

#intro {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: radial-gradient(ellipse at center, #172d40, #060a10 75%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity .7s ease, visibility .7s;
}

#intro.finished {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-logo {
  font-size: clamp(35px, 8vw, 65px);
  font-weight: 900;
  letter-spacing: 9px;
  opacity: 0;
  transform: scale(.75);
  animation: logoIn .8s forwards;
}

.intro-logo span {
  color: var(--blue);
}

.intro-subtitle {
  color: #7e9bb2;
  font-size: 11px;
  letter-spacing: 5px;
  margin-top: 8px;
  opacity: 0;
  animation: fadeIn .6s .5s forwards;
}

.gauge {
  width: min(330px, 75vw);
  margin-top: 18px;
}

.gauge svg {
  width: 100%;
  overflow: visible;
}

.tick {
  stroke: #263d50;
  stroke-width: 4;
  stroke-linecap: round;
  opacity: .2;
}

.tick.lit {
  animation: tickOn .12s forwards;
}

.needle {
  transform-origin: 160px 155px;
  transform: rotate(-90deg);
  animation: needleMove 1.8s 1.1s cubic-bezier(.35,.05,.2,1) forwards;
}

.gauge-number {
  fill: white;
  font-size: 25px;
  font-weight: bold;
}

.gauge-unit {
  fill: #7592aa;
  font-size: 10px;
  letter-spacing: 2px;
}

.loading-text {
  color: #7592aa;
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 12px;
  animation: pulse 1s infinite alternate;
}

@keyframes logoIn {
  to { opacity: 1; transform: scale(1); }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

@keyframes tickOn {
  to { opacity: 1; stroke: var(--tick-color); }
}

@keyframes needleMove {
  0% { transform: rotate(-90deg); }
  35% { transform: rotate(90deg); }
  55% { transform: rotate(45deg); }
  78% { transform: rotate(-15deg); }
  100% { transform: rotate(-90deg); }
}

@keyframes pulse {
  to { opacity: .35; }
}

/* APPARITION */

header, main {
  opacity: 0;
  transform: translateY(12px);
  animation: interfaceIn .7s 2.9s forwards;
}

@keyframes interfaceIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ECRANS PLUS PETITS */

@media (max-width: 650px) {
  header {
    height: 48px;
    padding: 0 10px;
  }

  .brand {
    font-size: 17px;
    letter-spacing: 2px;
  }

  #status {
    font-size: 10px;
  }

  #connect {
    padding: 7px 9px;
    font-size: 11px;
  }

  main {
    height: calc(100vh - 48px);
    gap: 8px;
    padding: 7px;
  }

  .control-group {
    gap: 6px;
  }

  .direction {
    width: clamp(48px, 13vw, 75px);
    height: clamp(55px, 16vw, 75px);
    border-radius: 12px;
    font-size: 27px;
  }

  .camera-panel {
    padding: 4px;
  }

  .camera-label {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<!-- ANIMATION DE DEMARRAGE -->

<div id="intro">
  <div class="intro-logo">EN<span>BOYA</span></div>
  <div class="intro-subtitle">ROBOT CONTROL SYSTEM</div>

  <div class="gauge">
    <svg viewBox="0 0 320 180">
      <defs>
        <linearGradient id="needleColor">
          <stop offset="0%" stop-color="#19a7ff"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
      </defs>

      <path d="M 45 155 A 115 115 0 0 1 275 155"
            fill="none" stroke="#20394d" stroke-width="8"
            stroke-linecap="round"/>

      <g id="ticks"></g>

      <text x="160" y="125" text-anchor="middle"
            class="gauge-number">ENBOYA</text>

      <text x="160" y="143" text-anchor="middle"
            class="gauge-unit">SYSTEM START</text>

      <g class="needle">
        <line x1="160" y1="155" x2="160" y2="48"
              stroke="url(#needleColor)" stroke-width="4"
              stroke-linecap="round"/>
        <circle cx="160" cy="155" r="8" fill="#19a7ff"/>
      </g>
    </svg>
  </div>

  <div class="loading-text">INITIALISATION...</div>
</div>

<!-- EN-TETE -->

<header>
  <div class="brand">EN<span>BOYA</span></div>

  <div class="connection">
    <span id="status">Bluetooth déconnecté</span>
    <button id="connect">CONNECTER</button>
  </div>
</header>

<!-- INTERFACE PRINCIPALE -->

<main>

  <div class="control-group left-controls">
    <button class="direction" data-command="L">◀</button>
    <button class="direction" data-command="R">▶</button>
  </div>

  <div class="camera-panel">
    <img id="camera"
         src="http://192.168.1.200:8080/video"
         alt="Caméra ENBOYA">
    <div class="camera-label">CAMÉRA EMBARQUÉE</div>
  </div>

  <div class="control-group right-controls">
    <button class="direction" data-command="F">▲</button>
    <button class="direction" data-command="B">▼</button>
  </div>

</main>

<script>
/* BLUETOOTH */

const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

let device = null;
let characteristic = null;

const statusText = document.getElementById("status");
const connectButton = document.getElementById("connect");

function updateStatus(text, color) {
  statusText.textContent = text;
  statusText.style.color = color;
}

connectButton.addEventListener("click", async () => {
  try {
    updateStatus("Recherche...", "#ffbd55");

    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });

    device.addEventListener("gattserverdisconnected", () => {
      characteristic = null;
      releaseAllControls();
      updateStatus("Bluetooth déconnecté", "#ff5555");
      connectButton.textContent = "CONNECTER";
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    characteristic = await service.getCharacteristic(
      CHARACTERISTIC_UUID
    );

    updateStatus("Bluetooth connecté", "#35e69a");
    connectButton.textContent = "CONNECTÉ";

  } catch (error) {
    console.error(error);
    updateStatus("Connexion impossible", "#ff5555");
  }
});

/* ENVOI BLUETOOTH */

async function sendCommand(command) {
  if (!characteristic) return;

  try {
    const data = new TextEncoder().encode(command);

    if (characteristic.writeValueWithoutResponse) {
      await characteristic.writeValueWithoutResponse(data);
    } else {
      await characteristic.writeValue(data);
    }
  } catch (error) {
    console.error("Erreur Bluetooth :", error);
  }
}

/* COMMANDES TACTILES */

const directionButtons = document.querySelectorAll(".direction");
const pressedPointers = new Map();

function getActiveCommand() {
  const active = [...pressedPointers.values()];

  return active.length ? active[active.length - 1] : "S";
}

function updateTouchCommand() {
  sendCommand(getActiveCommand());

  directionButtons.forEach(button => {
    button.classList.toggle(
      "active",
      [...pressedPointers.values()].includes(button.dataset.command)
    );
  });
}

function releaseAllControls() {
  pressedPointers.clear();
  directionButtons.forEach(button => button.classList.remove("active"));
}

directionButtons.forEach(button => {
  button.addEventListener("contextmenu", event => event.preventDefault());

  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    if (!characteristic) return;

    pressedPointers.set(event.pointerId, button.dataset.command);
    button.setPointerCapture(event.pointerId);
    updateTouchCommand();
  });

  function releasePointer(event) {
    if (!pressedPointers.has(event.pointerId)) return;

    pressedPointers.delete(event.pointerId);
    updateTouchCommand();
  }

  button.addEventListener("pointerup", releasePointer);
  button.addEventListener("pointercancel", releasePointer);
  button.addEventListener("lostpointercapture", releasePointer);
});

/* COMMANDES AU CLAVIER DU PC */

const keyboardCommands = {
  "z": "F",
  "s": "B",
  "q": "L",
  "d": "R",
  " ": "S"
};

const pressedKeys = new Set();

function updateKeyboardCommand() {
  if (pressedKeys.size === 0) return;

  const keys = [...pressedKeys];
  sendCommand(keyboardCommands[keys[keys.length - 1]]);
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (!(key in keyboardCommands)) return;

  event.preventDefault();

  if (!characteristic || event.repeat) return;

  pressedKeys.add(key);
  updateKeyboardCommand();
});

document.addEventListener("keyup", event => {
  const key = event.key.toLowerCase();

  if (!pressedKeys.has(key)) return;

  event.preventDefault();
  pressedKeys.delete(key);

  if (pressedKeys.size === 0) {
    sendCommand("S");
  } else {
    updateKeyboardCommand();
  }
});

/* ARRET SI LA PAGE PERD LE FOCUS */

function stopAllCommands() {
  releaseAllControls();
  pressedKeys.clear();
  sendCommand("S");
}

window.addEventListener("blur", stopAllCommands);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopAllCommands();
});

/* GRADUATIONS DU COMPTEUR */

const ticks = document.getElementById("ticks");

for (let i = 0; i <= 20; i++) {
  const angle = (-180 + i * 9) * Math.PI / 180;

  const x1 = 160 + Math.cos(angle) * 112;
  const y1 = 155 + Math.sin(angle) * 112;
  const x2 = 160 + Math.cos(angle) * 128;
  const y2 = 155 + Math.sin(angle) * 128;

  const tick = document.createElementNS(
    "http://www.w3.org/2000/svg", "line"
  );

  tick.setAttribute("x1", x1);
  tick.setAttribute("y1", y1);
  tick.setAttribute("x2", x2);
  tick.setAttribute("y2", y2);
  tick.setAttribute("class", "tick");

  let color = "#35e69a";
  if (i >= 13) color = "#ffbd55";
  if (i >= 17) color = "#ff4545";

  tick.style.setProperty("--tick-color", color);
  tick.style.animationDelay = (0.7 + i * 0.055) + "s";

  ticks.appendChild(tick);
}

setTimeout(() => {
  document.querySelectorAll(".tick").forEach(tick => {
    tick.classList.add("lit");
  });
}, 700);

/* FIN DU DEMARRAGE */

setTimeout(() => {
  document.getElementById("intro").classList.add("finished");
}, 3300);

</script>
</body>
</html>
