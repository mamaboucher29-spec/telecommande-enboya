
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENBOYA - Télécommande</title>

<style>
:root {
  --accent: #00b894;
  --button-size: 100px;
  --gap: 14px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #15191f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* EN-TÊTE */

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1100px;
  margin: auto;
  gap: 10px;
}

h1 {
  font-size: 22px;
  margin: 8px;
}

#status {
  color: #ffcc66;
  font-size: 14px;
}

#connect {
  background: var(--accent);
  color: #101010;
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-weight: bold;
}

/* DISPOSITION PRINCIPALE */

#mainLayout {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 35px;
  max-width: 1200px;
  margin: 25px auto;
}

/* COMMANDES */

.controlColumn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--gap);
  flex: 1;
}

/* Groupe gauche : tourner */

.controlColumn:first-child {
  flex-direction: row;
}

/* BOUTONS */

.direction {
  width: var(--button-size);
  height: var(--button-size);
  flex-shrink: 0;
  border: 2px solid #555;
  border-radius: 20px;
  background: #303943;
  color: white;
  font-size: 46px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.direction.active {
  background: var(--accent);
  color: #101010;
  border-color: white;
  transform: scale(0.95);
}

/* CAMÉRA */

#cameraContainer {
  width: min(40vw, 430px);
  aspect-ratio: 4 / 3;
  flex-shrink: 0;
  background: black;
  border: 2px solid #444;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

#camera {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#cameraStatus {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 5px;
  color: white;
  font-size: 12px;
  background: #0009;
}

/* PERSONNALISATION */

#settingsToggle {
  background: #303943;
  color: white;
  border: 1px solid #555;
  padding: 11px 18px;
  border-radius: 10px;
}

.settings {
  max-width: 350px;
  margin: 15px auto;
  padding: 18px;
  background: #222831;
  border-radius: 15px;
  text-align: left;
}

.settings label {
  display: block;
  margin: 15px 0 6px;
}

.settings input {
  width: 100%;
}

.hidden {
  display: none;
}

/* ÉCRAN PAYSAGE */

@media (orientation: landscape) {
  body {
    padding: 6px 12px;
  }

  #mainLayout {
    margin: 15px auto;
  }
}

/* PETITS ÉCRANS EN PAYSAGE */

@media (orientation: landscape) and (max-height: 500px) {
  h1 {
    font-size: 18px;
    margin: 4px;
  }

  #connect {
    padding: 8px 12px;
  }

  #mainLayout {
    margin: 8px auto;
    gap: 20px;
  }

  .direction {
    width: min(var(--button-size), 19vh);
    height: min(var(--button-size), 19vh);
    font-size: 36px;
  }

  #cameraContainer {
    width: min(38vw, 350px);
  }
}

/* ÉCRAN PORTRAIT */

@media (orientation: portrait) {
  #mainLayout {
    flex-wrap: wrap;
    gap: 12px;
  }

  #cameraContainer {
    order: -1;
    width: 75vw;
  }

  .controlColumn {
    flex-direction: row;
  }

  .controlColumn:first-child {
    flex-direction: row;
  }

  .direction {
    width: min(var(--button-size), 20vw);
    height: min(var(--button-size), 20vw);
  }
}
</style>
</head>

<body>

<header>
  <h1>ENBOYA</h1>
  <div id="status">Bluetooth déconnecté</div>
  <button id="connect">CONNECTER</button>
</header>

<main id="mainLayout">

  <!-- COMMANDES GAUCHE / DROITE -->
  <div class="controlColumn">

    <button class="direction" data-command="L">◀</button>
    <button class="direction" data-command="R">▶</button>

  </div>

  <!-- CAMÉRA MOTOROLA -->
  <div id="cameraContainer">

    <img
      id="camera"
      src="http://192.168.1.200:8080/video"
      alt="Caméra ENBOYA"
    >

    <div id="cameraStatus">Connexion caméra...</div>

  </div>

  <!-- COMMANDES AVANCER / RECULER -->
  <div class="controlColumn">

    <button class="direction" data-command="F">▲</button>
    <button class="direction" data-command="B">▼</button>

  </div>

</main>

<button id="settingsToggle">PERSONNALISER ⚙</button>

<div class="settings hidden" id="settings">

  <label>Couleur des boutons</label>
  <input type="color" id="color" value="#00b894">

  <label>Taille des boutons</label>
  <input type="range" id="size" min="65" max="145" value="100">

  <label>Espacement des boutons</label>
  <input type="range" id="spacing" min="4" max="30" value="14">

</div>

<script>

/* BLUETOOTH */

let device = null;
let characteristic = null;
let activeButton = null;

const statusText = document.getElementById("status");

async function connectRobot() {

  try {

    if (!navigator.bluetooth) {
      statusText.textContent = "Bluetooth non disponible";
      return;
    }

    statusText.textContent = "Recherche du HM-10...";

    device = await navigator.bluetooth.requestDevice({
      filters: [{
        services: [
          "0000ffe0-0000-1000-8000-00805f9b34fb"
        ]
      }]
    });

    device.addEventListener(
      "gattserverdisconnected",
      () => {
        releaseButton();
        characteristic = null;
        statusText.textContent = "Bluetooth déconnecté";
        document.getElementById("connect").textContent = "CONNECTER";
      }
    );

    const server = await device.gatt.connect();

    const service = await server.getPrimaryService(
      "0000ffe0-0000-1000-8000-00805f9b34fb"
    );

    characteristic = await service.getCharacteristic(
      "0000ffe1-0000-1000-8000-00805f9b34fb"
    );

    statusText.textContent = "Bluetooth connecté";
    document.getElementById("connect").textContent = "CONNECTÉ";

  } catch (error) {

    statusText.textContent = "Erreur : " + error.message;

  }

}

/* ENVOI DES COMMANDES */

async function sendCommand(command) {

  if (!characteristic) return;

  try {

    const data = new TextEncoder().encode(command);

    if (characteristic.properties.writeWithoutResponse) {
      await characteristic.writeValueWithoutResponse(data);
    } else {
      await characteristic.writeValue(data);
    }

  } catch (error) {

    statusText.textContent = "Erreur Bluetooth";

  }

}

/* ARRÊT AU RELÂCHEMENT */

function releaseButton() {

  if (activeButton) {

    activeButton.classList.remove("active");
    activeButton = null;

    sendCommand("S");

  }

}

/* GESTION DES QUATRE BOUTONS */

document.querySelectorAll(".direction").forEach(button => {

  button.addEventListener("pointerdown", event => {

    event.preventDefault();

    if (!characteristic || activeButton) return;

    activeButton = button;

    button.classList.add("active");

    button.setPointerCapture(event.pointerId);

    sendCommand(button.dataset.command);

  });

  button.addEventListener("pointerup", event => {

    event.preventDefault();
    releaseButton();

  });

  button.addEventListener("pointercancel", releaseButton);
  button.addEventListener("lostpointercapture", releaseButton);

});

/* BOUTON BLUETOOTH */

document.getElementById("connect").addEventListener(
  "click",
  connectRobot
);

/* PERSONNALISATION */

document.getElementById("settingsToggle").addEventListener(
  "click",
  () => {
    document.getElementById("settings").classList.toggle("hidden");
  }
);

document.getElementById("color").addEventListener(
  "input",
  event => {
    document.documentElement.style.setProperty(
      "--accent",
      event.target.value
    );
  }
);

document.getElementById("size").addEventListener(
  "input",
  event => {
    document.documentElement.style.setProperty(
      "--button-size",
      event.target.value + "px"
    );
  }
);

document.getElementById("spacing").addEventListener(
  "input",
  event => {
    document.documentElement.style.setProperty(
      "--gap",
      event.target.value + "px"
    );
  }
);

/* SÉCURITÉ : ARRÊT LORSQUE LA PAGE PERD LE FOCUS */

window.addEventListener("pagehide", releaseButton);
window.addEventListener("blur", releaseButton);

</script>

</body>
</html>
