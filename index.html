
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENBOYA - Télécommande</title>

<style>
:root {
  --accent: #00b894;
  --button-size: 85px;
  --gap: 12px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #15191f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 900px;
  margin: auto;
}

h1 {
  font-size: 22px;
  margin: 8px;
}

#status {
  color: #ffcc66;
  font-size: 13px;
}

#connect {
  background: var(--accent);
  color: #101010;
  border: none;
  border-radius: 10px;
  padding: 11px 15px;
  font-weight: bold;
  margin: 8px;
}

#mainLayout {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  max-width: 1000px;
  margin: 20px auto;
}

.controlColumn {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

.direction {
  width: var(--button-size);
  height: var(--button-size);
  border: 2px solid #555;
  border-radius: 16px;
  background: #303943;
  color: white;
  font-size: 35px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.direction.active {
  background: var(--accent);
  color: #101010;
  border-color: white;
  transform: scale(0.95);
}

#cameraContainer {
  width: min(42vw, 420px);
  aspect-ratio: 4 / 3;
  background: #000;
  border: 2px solid #444;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

#camera {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#cameraStatus {
  position: absolute;
  bottom: 5px;
  left: 0;
  right: 0;
  color: white;
  font-size: 11px;
  background: #0009;
  padding: 4px;
}

#settingsToggle {
  background: #303943;
  color: white;
  border: 1px solid #555;
  padding: 10px 18px;
  border-radius: 10px;
}

.settings {
  max-width: 350px;
  margin: 15px auto;
  padding: 18px;
  background: #222831;
  border-radius: 15px;
  text-align: left;
}

.settings label {
  display: block;
  margin: 15px 0 6px;
}

.settings input {
  width: 100%;
}

.hidden {
  display: none;
}

@media (orientation: portrait) {
  #mainLayout {
    flex-wrap: wrap;
    gap: 10px;
  }

  #cameraContainer {
    order: -1;
    width: 75vw;
  }

  .controlColumn {
    flex-direction: row;
  }
}

@media (max-height: 450px) and (orientation: landscape) {
  body {
    padding: 4px;
  }

  h1 {
    font-size: 17px;
    margin: 3px;
  }

  #connect {
    padding: 7px 10px;
    margin: 3px;
  }

  #mainLayout {
    margin: 5px auto;
    gap: 12px;
  }

  #cameraContainer {
    width: min(38vw, 330px);
  }

  .direction {
    width: min(var(--button-size), 17vh);
    height: min(var(--button-size), 17vh);
    font-size: 30px;
  }

  .controlColumn {
    gap: 8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>ENBOYA</h1>
  <div id="status">Bluetooth déconnecté</div>
  <button id="connect">CONNECTER</button>
</header>

<div id="mainLayout">

  <!-- Commandes de direction -->
  <div class="controlColumn">
    <button class="direction" data-command="L">◀</button>
    <button class="direction" data-command="R">▶</button>
  </div>

  <!-- Caméra Motorola -->
  <div id="cameraContainer">
    <img id="camera"
         src="http://192.168.1.200:8080/video"
         alt="Caméra ENBOYA">
    <div id="cameraStatus">Connexion caméra...</div>
  </div>

  <!-- Commandes avancer / reculer -->
  <div class="controlColumn">
    <button class="direction" data-command="F">▲</button>
    <button class="direction" data-command="B">▼</button>
  </div>

</div>

<button id="settingsToggle">PERSONNALISER ⚙</button>

<div class="settings hidden" id="settings">

  <label>Couleur des boutons</label>
  <input type="color" id="color" value="#00b894">

  <label>Taille des boutons</label>
  <input type="range" id="size" min="55" max="120" value="85">

  <label>Espacement</label>
  <input type="range" id="spacing" min="4" max="25" value="12">

</div>

<script>
let device = null;
let characteristic = null;
let activeButton = null;

const statusText = document.getElementById("status");
const camera = document.getElementById("camera");
const cameraStatus = document.getElementById("cameraStatus");

camera.onload = () => {
  cameraStatus.textContent = "CAMÉRA CONNECTÉE";
};

camera.onerror = () => {
  cameraStatus.textContent = "CAMÉRA INDISPONIBLE";
};

async function connectRobot() {
  try {
    if (!navigator.bluetooth) {
      statusText.textContent = "Bluetooth Web non disponible";
      return;
    }

    statusText.textContent = "Recherche du HM-10...";

    device = await navigator.bluetooth.requestDevice({
      filters: [{
        services: ["0000ffe0-0000-1000-8000-00805f9b34fb"]
      }]
    });

    device.addEventListener("gattserverdisconnected", () => {
      characteristic = null;
      statusText.textContent = "Bluetooth déconnecté";
      releaseButton();
      document.getElementById("connect").textContent = "CONNECTER";
    });

    const server = await device.gatt.connect();

    const service = await server.getPrimaryService(
      "0000ffe0-0000-1000-8000-00805f9b34fb"
    );

    characteristic = await service.getCharacteristic(
      "0000ffe1-0000-1000-8000-00805f9b34fb"
    );

    statusText.textContent = "Bluetooth connecté";
    document.getElementById("connect").textContent = "CONNECTÉ";

  } catch (error) {
    statusText.textContent = "Erreur : " + error.message;
  }
}

async function sendCommand(command) {
  if (!characteristic) return;

  try {
    const data = new TextEncoder().encode(command);

    if (characteristic.properties.writeWithoutResponse) {
      await characteristic.writeValueWithoutResponse(data);
    } else {
      await characteristic.writeValue(data);
    }
  } catch (error) {
    statusText.textContent = "Erreur Bluetooth";
  }
}

function releaseButton() {
  if (activeButton) {
    activeButton.classList.remove("active");
    activeButton = null;
    sendCommand("S");
  }
}

document.querySelectorAll(".direction").forEach(button => {

  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    if (!characteristic || activeButton) return;

    activeButton = button;
    button.classList.add("active");
    button.setPointerCapture(event.pointerId);

    sendCommand(button.dataset.command);
  });

  button.addEventListener("pointerup", event => {
    event.preventDefault();
    releaseButton();
  });

  button.addEventListener("pointercancel", releaseButton);
  button.addEventListener("lostpointercapture", releaseButton);
});

document.getElementById("connect").addEventListener(
  "click", connectRobot
);

document.getElementById("settingsToggle").addEventListener(
  "click", () => {
    document.getElementById("settings").classList.toggle("hidden");
  }
);

document.getElementById("color").addEventListener("input", event => {
  document.documentElement.style.setProperty(
    "--accent", event.target.value
  );
});

document.getElementById("size").addEventListener("input", event => {
  document.documentElement.style.setProperty(
    "--button-size", event.target.value + "px"
  );
});

document.getElementById("spacing").addEventListener("input", event => {
  document.documentElement.style.setProperty(
    "--gap", event.target.value + "px"
  );
});

window.addEventListener("pagehide", releaseButton);
window.addEventListener("blur", releaseButton);
</script>

</body>
</html>
